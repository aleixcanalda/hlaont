# HLAONT gene manifest — the single source of per-gene behaviour (development notes invariant 5).
#
# All 47 IPD-IMGT/HLA genes are listed here from commit one; 36 are active in v0
# (tier 1-3). Never branch on gene name in code — add a field here instead.
#
# Field provenance, so downstream editors know what to trust:
#   tier, cn_model (H/T/K/U/Y/R/W and DRB3/4/5), calibrator, segment (where filled) —
#     stated explicitly in DESIGN.md S2c/S1. High confidence.
#   class — genomic region (I/II/III), standard MHC organisation, not IPD/DESIGN-sourced.
#     Used for calibrator grouping (class I/II sit ~1-2Mb apart, DESIGN S1).
#   cn_model: diploid_typical — DESIGN's worked example spells this `fixed_2` for
#     HLA-A. Relabelled here on explicit guidance: classical HLA genes have published
#     exonic deletions (e.g. HLA-A) even though the vast majority of haplotypes carry
#     no major SV in the coding region. "fixed_2" reads as a hardcoded assumption —
#     exactly what invariant 3 says to remove. `diploid_typical` is a prior for CI
#     width/QC thresholds, not a skip switch. See cn_policy below.
#   cn_model for MICA (variable_0_2) — inferred from DESIGN S1's "MICA: deletion
#     haplotypes (linked to B*48:01)" note. The deletion can occur on either or both
#     haplotypes independently (most individuals carry two intact copies, some carry
#     one, rarely both are deleted), so the range is 0-2 like DRB3/4/5, not capped at 1.
#     DESIGN gives no vocabulary for this case; this value is inferred, not a quote.
#   segment — null except the six genes DESIGN S2c names explicitly. Filling the
#     rest requires resources/segments.yaml, derived from the 8 MHC reference
#     haplotypes (DESIGN S2c: "a required resource... getting these boundaries
#     right matters more than any per-gene tuning"). Left null rather than guessed.
#   audit_genomic_v3.65.0 — genomic-template count from ipd_audit_v3.65.0.txt,
#     for provenance only. build.py recomputes its own counts; this is not
#     read by any pipeline code.
#
# excluded: true -> HLA-Cw, a legacy alias (not a gene) and a parser edge case
#   (DESIGN S2c), not a gene manifest entry in the working sense.
#
# C4A and C4B (DESIGN S2f) are both listed, sharing the rccx segment: "Total C4 CN"
# is a single depth-ratio readout for the segment, then A-vs-B is a discrimination
# call (exon 26 peptides) on top of it, not two independently-counted genes. Neither
# routes through S2a-2e (no IPD star-allele nomenclature for either).

manifest_version: 1
source:
  - DESIGN.md S2c (gene manifest, tiers)
  - DESIGN.md S1 (CN model, calibrator panel)
  - DESIGN.md S2f (C4A/C4B, RCCX module)
  - ipd_audit_v3.65.0.txt (audit_genomic_v3.65.0 counts)

cn_policy:
  note: >
    CN is estimated for every gene, every run, regardless of cn_model (DESIGN S1:
    CN is a second readout of the read x allele assignment matrix, not a separate
    stage gated by a per-gene switch). `cn_model` is an expected-pattern label for
    CI width and QC thresholds, never a hardcoded assumption that skips estimation.
    `diploid_typical` genes are not exempt from invariant 4 (a CN=0 call is guilty
    until proven innocent): deletions occur in classical HLA genes too (e.g. HLA-A
    exonic deletions), just less often than in the segmentally-duplicated
    pseudogenes. Any CN deviating from a gene's typical/modal pattern requires
    segment-level support or reference-space corroboration before being reported —
    same bar as the tier 1 CN-variable pseudogenes, not a relaxed one.

