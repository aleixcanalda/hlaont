[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hlaont"
version = "0.1.0"
description = "Confidence-aware full-field HLA typing from ONT R10 long reads"
readme = "README.md"
# hlaont's own code is MIT; resources/models/vendor/nanopore2023.gz is
# Badread's error model, GPL-3.0-only (see that directory's NOTICE.md).
license = "MIT AND GPL-3.0-only"
license-files = [
    "LICENSE",
    "src/hlaont/resources/anchors/vendor/FUFIHLA_LICENSE",
    "src/hlaont/resources/models/vendor/BADREAD_LICENSE",
]
authors = [{ name = "Aleix Canalda" }]
requires-python = ">=3.11"
dependencies = [
    "pysam",
    "numpy",
    "pyyaml",
]
keywords = ["HLA", "HLA typing", "nanopore", "ONT", "long reads", "MHC", "bioinformatics", "genomics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "types-PyYAML", "build", "twine"]

[project.urls]
Homepage = "https://github.com/aleixcanalda/hlaont"
Repository = "https://github.com/aleixcanalda/hlaont"
Issues = "https://github.com/aleixcanalda/hlaont/issues"

[project.scripts]
hlaont = "hlaont.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hlaont*"]

# Checked-in resources only; templates/raw, templates/pool and
# anchors/build_staging are regenerated by update-db/update-anchors.
[tool.setuptools.package-data]
hlaont = [
    "resources/genes.yaml",
    "resources/models/*.yaml",
    "resources/models/vendor/*",
    "resources/regions/*.bed",
    "resources/regions/*.yaml",
    "resources/anchors/*.gz",
    "resources/anchors/*.json",
    "resources/anchors/vendor/*",
    "resources/templates/assembly_bundle/*",
    "resources/controls/*.gz",
]

[tool.setuptools.exclude-package-data]
"*" = ["test_*.py", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
