# GRCh38 chr6 identification and MHC ALT contigs (DESIGN.md S3.1).
# Sources (2026-07-21): NCBI GCA_000001405.15 all_alt_scaffold_placement.txt
# (chr6 length, ALT accessions/haplotypes) and the 1000G
# GRCh38_full_analysis_set_plus_decoy_hla.fa.fai (aliases, decoy names).
# Note: GL000250 = APD, GL000251 = COX (DESIGN.md had them swapped; matching
# uses accessions/aliases only).
# HLA decoys (~525) are matched by name pattern, not enumerated.

version: 1
source: >
  NCBI GCA_000001405.15_GRCh38_assembly_structure/all_alt_scaffold_placement.txt
  and the 1000G GRCh38_full_analysis_set_plus_decoy_hla.fa.fai, fetched
  2026-07-21. Not ported from FuFiHLA -- this is GRCh38-assembly metadata,
  not a FuFiHLA constant.

# chr6 aliases and length; matched together (invariant 2).
primary_contig:
  aliases: ["chr6", "6"]
  length: 170805979

# The 7 GRCh38 MHC ALT scaffolds. `aliases` covers both naming conventions
# seen in practice: the 1000G/UKB-style "chr6_GL000250v2_alt" form and the
# bare NCBI accession "GL000250.2" form.
alt_contigs:
  - accession: GL000250.2
    haplotype: APD
    aliases: ["chr6_GL000250v2_alt", "GL000250.2"]
  - accession: GL000251.2
    haplotype: COX
    aliases: ["chr6_GL000251v2_alt", "GL000251.2"]
  - accession: GL000252.2
    haplotype: DBB
    aliases: ["chr6_GL000252v2_alt", "GL000252.2"]
  - accession: GL000253.2
    haplotype: MANN
    aliases: ["chr6_GL000253v2_alt", "GL000253.2"]
  - accession: GL000254.2
    haplotype: MCF
    aliases: ["chr6_GL000254v2_alt", "GL000254.2"]
  - accession: GL000255.2
    haplotype: QBL
    aliases: ["chr6_GL000255v2_alt", "GL000255.2"]
  - accession: GL000256.2
    haplotype: SSTO
    aliases: ["chr6_GL000256v2_alt", "GL000256.2"]

# Regex for HLA decoy contig names (verbatim IPD-style allele nomenclature
# used as a contig name), e.g. "HLA-A*01:01:01:01", "HLA-DRB1*15:01:01:04".
hla_decoy_pattern: '^HLA-\w+\*'
