# HLAONT gene manifest: the single source of per-gene behaviour (invariant 5).
# Never branch on gene name in code; add a field here.
#
# Fields:
#   tier, cn_model (H/T/K/U/Y/R/W, DRB3/4/5), calibrator, segment: from
#     DESIGN.md S2c/S1. segment is filled only where DESIGN names it and is
#     documentary (CN is per gene).
#   class: MHC region (I/II/III).
#   cn_model: diploid_typical is a prior, not an assumption (classical genes
#     have deletions too). MICA is variable_0_2 (B*48:01-linked deletions on
#     either haplotype).
#   audit_genomic_v3.65.0: IPD genomic-template count (provenance only).
#   assembly_extraction: gtf_coordinate (HLA-N/P/T/U/W/Y/R): templates
#     extracted from hla_seq/ assemblies (assembly_sources.py; prefers the v2
#     re-annotation, which adds HLA-R).
#   audit_hla_seq_v1: distinct assembly-derived sequences (provenance only).
#   excluded: HLA-Cw is a legacy alias, not a gene.
#
# C4A/C4B (DESIGN S2f): one total-CN readout plus A/B discrimination; no
# star-allele typing.

manifest_version: 1
source:
  - DESIGN.md S2c (gene manifest, tiers)
  - DESIGN.md S1 (CN model, calibrator panel)
  - DESIGN.md S2f (C4A/C4B, RCCX module)
  - ipd_audit_v3.65.0.txt (audit_genomic_v3.65.0 counts)

cn_policy:
  note: >
    CN is estimated for every gene, every run, regardless of cn_model (DESIGN S1:
    CN is a second readout of the read x allele assignment matrix, not a separate
    stage gated by a per-gene switch). `cn_model` is an expected-pattern label for
    CI width and QC thresholds, never a hardcoded assumption that skips estimation.
    `diploid_typical` genes are not exempt from invariant 4 (a CN=0 call is guilty
    until proven innocent): deletions occur in classical HLA genes too (e.g. HLA-A
    exonic deletions), just less often than in the segmentally-duplicated
    pseudogenes. Any CN deviating from a gene's typical/modal pattern requires
    segment-level support or reference-space corroboration before being reported —
    same bar as the tier 1 CN-variable pseudogenes, not a relaxed one.

