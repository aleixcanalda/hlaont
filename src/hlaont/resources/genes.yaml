    # low_cn_floor (added 2026-07-27, real HG00097 ONT benchmark, user's own
    # hypothesis; re-derived 2026-08-31, user-directed): DRB1 sits in the
    # same physical block and is essentially always present at real depth,
    # so a stray, thin cn_estimate for its presence/absence paralogs here
    # is plausibly cross-mapped DRB1 read leakage, not genuine partial
    # presence -- pipeline.py treats an estimate below this as CN=0 rather
    # than rounding normally to 1.
    #
    # Re-derived 2026-08-31: stages/cn.py's depth source changed the same
    # session (see that module's docstring) -- the original 0.9 floor was
    # tuned against the old Stage-1-matrix-derived signal's scale, and the
    # new Stage-0 signal (no cross-gene resolution, module docstring)
    # brings DRB3/4/5's own estimates much closer together when only one
    # is truly present, since all three are themselves close paralogs of
    # each other, the same tradeoff already accepted for HLA-H/K/T/U/W.
    # Real regression found and root-caused directly: HG00097's true
    # HLA-DRB5 (real single-haplotype presence) now estimates 0.898 -- just
    # under the old 0.9 floor, silently dropped. Re-derived from the two
    # real data points now available: HG00320's true-absent HLA-DRB4
    # estimates 0.47 (floor must stay above this) and HG00097's
    # true-present HLA-DRB5 estimates 0.898 (floor must stay below this).
    # 0.5, user's own chosen value: inside that window but close to its
    # lower edge (0.47), deliberately biased toward the lower end per
    # invariant 4 (a false absence is the worse failure mode here) --
    # tighter headroom against HG00320's own 0.47 than a more conservative
    # midpoint would give, an explicit tradeoff, not an oversight.
    # Confirmed this does not reopen a false positive: HG00097's own
    # true-absent HLA-DRB4 now estimates 1.09 -- above *any* floor value
    # this field alone could use -- but is caught downstream anyway by the
    # unrelated, already-existing `min_mean_qv` calls.tsv filter (its own
    # real per-haplotype consensus there is 4 reads / mean_qv 5.0, filtered
    # from output regardless of this field). Still provisional/unvalidated
    # beyond these two real samples (invariant 11), scoped to these three
    # genes only pending real evidence for others sharing
    # cn_model: variable_0_2 (e.g. MICA).
    low_cn_floor: 0.5

