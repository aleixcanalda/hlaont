# Stage 0 FASTQ anchor sieve parameters (DESIGN.md S3.2), ported from
# FuFiHLA's raw_reads_filter.py (used unchanged by its HiFi and ONT
# pipelines):
#
#   if coverage < 0.4 and ref_start > 200 and ref_end < ref_len - 200:
#       continue
#   valid = [aln for aln in alignments[read_id]
#            if aln['score'] <= 10 * best_score and aln['gene'] in target_genes]
#
# Provisional (invariant 11): not re-derived for 15X ONT R10.
# HPRC/GIAB fixtures exist (tests/data/, not populated yet).

version: 1
source: >
  FuFiHLA share/fufihla/src/raw_reads_filter.py, ported unchanged. NOT
  re-derived for ONT R10 -- provisional, pending calib/ calibration.
# Keep an alignment covering >= this fraction of the anchor...
# Lowered from 0.4: at 0.4 only 76 of 234 C4-overlapping reads were kept
# (HG00253); with no bar the extras were mostly short. Global; re-validate
# the benchmark after changing.
# cluster -- re-validate the full benchmark after any further change here.
min_anchor_coverage: 0.1

# ...OR if it sits within this many bp of either end of the anchor (rescues
# reads that only partially overlap a short/partial anchor near its edge).
anchor_edge_distance_bp: 200

# Keep a read only if it has >= 1 qualifying alignment to a target-role gene
# whose mismatch rate is within this multiple of the read's single best
# mismatch rate across ALL anchors (target and decoy). A read whose best
# match is a decoy/paralog, with no target hit this close, is dropped
# entirely -- this is what makes the decoy anchors do their job.
mismatch_rate_multiplier: 10.0
