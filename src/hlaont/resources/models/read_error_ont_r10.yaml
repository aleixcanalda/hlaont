# Stage 2 read-likelihood config for ONT R10 (DESIGN.md S2e, invariant 10).
# The HiFi milestone-1 check passes its own flat ErrorModel instead.
# context_model is Badread's per-7-mer table from real R10.4.1 reads; a flat
# rate mis-scores homopolymers. Provisional until fitted on our cohort.

version: 2
platform: ont_r10
source: >
  context_model is Badread's nanopore2023 table (real ONT R10.4.1
  alignments, github.com/rrwick/Badread), NOT fitted from our own data.
  Provisional per invariant 11 -- superseded by a calib/-fitted model once
  tests/data/ ONT R10 fixtures exist.

# Badread per-7-mer error table (relative to this file); see
# stages/error_model.py and vendor/NOTICE.md (GPLv3).
context_model: vendor/nanopore2023.gz

# Flat per-base rate for (read, allele) pairs with no alignment, applied
# over the read's best span elsewhere (no CIGAR context available).
unaligned_edit_rate: 0.75
